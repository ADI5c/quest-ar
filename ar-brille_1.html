<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Brille - Greifen, Schnitt & Masse</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script>

      // ════════════════════════════════════════════════════════════════
      // GLB BIBLIOTHEK
      //   unit: 'm'  = GLB in Metern (glTF-Standard)
      //   unit: 'mm' = GLB-Werte sind Millimeter
      //   unit: 'cm' = GLB-Werte sind Zentimeter
      // ════════════════════════════════════════════════════════════════
      const GLB_BIBLIOTHEK = [
        { name: 'AR Brille',     src: 'EntwurfARBrille.glb', unit: 'm' },
        { name: 'STEP Export 1', src: 'bauteil1.glb',        unit: 'm' },
        { name: 'STEP Export 2', src: 'bauteil2.glb',        unit: 'm' },
      ];

      const UNIT_SCALE = { 'mm': 0.001, 'cm': 0.01, 'm': 1.0 };

      function setHudText(id, text, color) {
        try {
          const el = document.querySelector(id);
          if (el) {
            el.setAttribute('value', text);
            if (color) el.setAttribute('color', color);
          }
        } catch (err) { /* nie kritisch */ }
      }


      // ════════════════════════════════════════════════════════════════
      // KOMPONENTE 1: AUTO-CENTER + MASSSTAB + MASSE MELDEN
      // ════════════════════════════════════════════════════════════════
      AFRAME.registerComponent('auto-center', {
        schema: { unitScale: { type: 'number', default: 1.0 } },

        init: function () {
          this.el.addEventListener('model-error', () => {
            setHudText('#ui-size', 'FEHLER: GLB nicht gefunden!', '#FF4444');
          });

          this.el.addEventListener('model-loaded', (e) => {
            try {
              const model = e.detail.model;
              if (!model) return;

              const box = new THREE.Box3().setFromObject(model);
              if (box.isEmpty()) {
                console.warn('Das 3D-Modell ist leer.');
                return;
              }

              const center = new THREE.Vector3();
              box.getCenter(center);
              model.position.x -= center.x;
              model.position.y -= center.y;
              model.position.z -= center.z;

              const s = this.data.unitScale;
              if (s !== 1.0) {
                this.el.object3D.scale.set(s, s, s);
              }

              // Reale Groesse in Metern
              const size = new THREE.Vector3();
              box.getSize(size);
              const dims = { x: size.x * s, y: size.y * s, z: size.z * s };

              const mmX = (dims.x * 1000).toFixed(0);
              const mmY = (dims.y * 1000).toFixed(0);
              const mmZ = (dims.z * 1000).toFixed(0);
              console.log('Modell | Groesse: ' + mmX + ' x ' + mmY + ' x ' + mmZ + ' mm');
              setHudText('#ui-size', mmX + ' x ' + mmY + ' x ' + mmZ + ' mm', '#AAFFAA');

              // Mass-Anzeige am Objekt aktualisieren
              const mn = document.querySelector('#model-node');
              if (mn && mn.components['mass-anzeige']) {
                // Offset = Position des Modell-Entities innerhalb von model-node
                const off = this.el.object3D.position;
                mn.components['mass-anzeige'].rebuild(dims,
                  { x: off.x, y: off.y, z: off.z });
              }
            } catch (err) {
              console.error('auto-center Fehler:', err);
            }
          });
        }
      });


      // ════════════════════════════════════════════════════════════════
      // KOMPONENTE 2: MASS-ANZEIGE (optional per Joystick-Druck)
      // Wireframe-Rahmen + mm-Beschriftung direkt am Objekt.
      // Zum Pruefen ob wirklich 1:1: mit realem Massstab vergleichen!
      // ════════════════════════════════════════════════════════════════
      AFRAME.registerComponent('mass-anzeige', {
        init: function () {
          this.visible = false;
          this.holder  = null;
        },

        rebuild: function (dims, offset) {
          try {
            // Alte Anzeige entfernen
            if (this.holder && this.holder.parentNode) {
              this.holder.parentNode.removeChild(this.holder);
            }

            this.holder = document.createElement('a-entity');
            this.holder.setAttribute('position',
              offset.x + ' ' + offset.y + ' ' + offset.z);
            this.el.appendChild(this.holder);

            // Wireframe-Box exakt in Modellgroesse
            const wf = document.createElement('a-box');
            wf.setAttribute('width',  dims.x);
            wf.setAttribute('height', dims.y);
            wf.setAttribute('depth',  dims.z);
            wf.setAttribute('material',
              'wireframe: true; color: #00FFAA; opacity: 0.9; transparent: true');
            this.holder.appendChild(wf);

            const mm = (v) => (v * 1000).toFixed(1) + ' mm';

            // Beschriftung BREITE (X) - unter dem Objekt
            const tx = document.createElement('a-text');
            tx.setAttribute('value', 'B: ' + mm(dims.x));
            tx.setAttribute('align', 'center');
            tx.setAttribute('color', '#00FFAA');
            tx.setAttribute('width', Math.max(0.6, dims.x * 2));
            tx.setAttribute('position', '0 ' + (-dims.y / 2 - 0.03) + ' ' + (dims.z / 2));
            this.holder.appendChild(tx);

            // Beschriftung HOEHE (Y) - rechts neben dem Objekt
            const ty = document.createElement('a-text');
            ty.setAttribute('value', 'H: ' + mm(dims.y));
            ty.setAttribute('align', 'center');
            ty.setAttribute('color', '#00FFAA');
            ty.setAttribute('width', Math.max(0.6, dims.y * 2));
            ty.setAttribute('rotation', '0 0 90');
            ty.setAttribute('position', (dims.x / 2 + 0.03) + ' 0 ' + (dims.z / 2));
            this.holder.appendChild(ty);

            // Beschriftung TIEFE (Z) - oben auf dem Objekt
            const tz = document.createElement('a-text');
            tz.setAttribute('value', 'T: ' + mm(dims.z));
            tz.setAttribute('align', 'center');
            tz.setAttribute('color', '#00FFAA');
            tz.setAttribute('width', Math.max(0.6, dims.z * 2));
            tz.setAttribute('rotation', '-90 0 0');
            tz.setAttribute('position', '0 ' + (dims.y / 2 + 0.03) + ' 0');
            this.holder.appendChild(tz);

            this.holder.setAttribute('visible', this.visible);
          } catch (err) {
            console.error('mass-anzeige Fehler:', err);
          }
        },

        toggle: function () {
          this.visible = !this.visible;
          if (this.holder) this.holder.setAttribute('visible', this.visible);
          return this.visible;
        }
      });


      // ════════════════════════════════════════════════════════════════
      // KOMPONENTE 3: HUD-FOLLOW
      // ════════════════════════════════════════════════════════════════
      AFRAME.registerComponent('hud-follow', {
        schema: {
          distance: { type: 'number', default: 0.8 },
          offsetY:  { type: 'number', default: -0.32 }
        },

        init: function () {
          this.tmpPos  = new THREE.Vector3();
          this.tmpDir  = new THREE.Vector3();
          this.tmpQuat = new THREE.Quaternion();
        },

        tick: function () {
          try {
            const cam = this.el.sceneEl.camera;
            if (!cam) return;

            cam.getWorldPosition(this.tmpPos);
            // WICHTIG: Bei Kameras liefert getWorldDirection bereits die
            // BLICKRICHTUNG (nach vorne) - NICHT negieren!
            cam.getWorldDirection(this.tmpDir);
            cam.getWorldQuaternion(this.tmpQuat);

            this.el.object3D.position.copy(this.tmpPos)
              .addScaledVector(this.tmpDir, this.data.distance);
            this.el.object3D.position.y += this.data.offsetY;
            this.el.object3D.quaternion.copy(this.tmpQuat);
          } catch (err) { /* nie kritisch */ }
        }
      });


      // ════════════════════════════════════════════════════════════════
      // KOMPONENTE 4: SCHNITTANSICHT (X / Y / Z)
      // ════════════════════════════════════════════════════════════════
      AFRAME.registerComponent('clipping-plane', {
        init: function () {
          this.plane        = new THREE.Plane();
          this.clipPosition = 0;
          this.axis         = 'y';
          this.enabled      = false;
          this.ready        = false;
          this.tmpRigPos    = new THREE.Vector3();

          const setup = () => {
            try {
              const renderer = this.el.sceneEl.renderer;
              if (!renderer) return;
              renderer.localClippingEnabled = true;
              renderer.clippingPlanes = [];
              this.ready = true;
            } catch (err) {
              console.error('clipping Setup-Fehler:', err);
            }
          };

          if (this.el.sceneEl.hasLoaded) setup();
          else this.el.sceneEl.addEventListener('loaded', setup);
        },

        cycleAxis: function () {
          this.axis = this.axis === 'y' ? 'x' : this.axis === 'x' ? 'z' : 'y';
          this.clipPosition = 0;
        },

        toggle: function () {
          if (!this.ready) return;
          this.enabled = !this.enabled;
          try {
            const renderer = this.el.sceneEl.renderer;
            renderer.clippingPlanes = this.enabled ? [this.plane] : [];
          } catch (err) {
            console.error('clipping Toggle-Fehler:', err);
          }
        },

        move: function (delta) {
          this.clipPosition = Math.max(-0.5, Math.min(0.5, this.clipPosition + delta));
        },

        tick: function () {
          if (!this.enabled || !this.ready) return;
          try {
            const rigEl = document.querySelector('#rig');
            if (!rigEl) return;
            rigEl.object3D.getWorldPosition(this.tmpRigPos);

            let normal;
            if      (this.axis === 'y') normal = new THREE.Vector3(0, -1,  0);
            else if (this.axis === 'x') normal = new THREE.Vector3(-1, 0,  0);
            else                         normal = new THREE.Vector3(0,  0, -1);

            const constant = -normal.dot(this.tmpRigPos) + this.clipPosition;
            this.plane.set(normal, -constant);
          } catch (err) { /* nie kritisch */ }
        }
      });


      // ════════════════════════════════════════════════════════════════
      // KOMPONENTE 5: GLB BIBLIOTHEK (GRIP oeffnet)
      // ════════════════════════════════════════════════════════════════
      AFRAME.registerComponent('bibliothek-menu', {
        init: function () {
          this.visible     = false;
          this.selectedIdx = 0;
          this.items       = GLB_BIBLIOTHEK;
          this.panel       = null;
          this.itemEls     = [];

          this.tmpPos  = new THREE.Vector3();
          this.tmpDir  = new THREE.Vector3();
          this.tmpQuat = new THREE.Quaternion();

          const build = () => {
            try { this._buildPanel(); }
            catch (err) { console.error('Bibliothek Aufbau-Fehler:', err); }
          };
          if (this.el.sceneEl.hasLoaded) build();
          else this.el.sceneEl.addEventListener('loaded', build);
        },

        _buildPanel: function () {
          this.panel = document.createElement('a-entity');
          this.panel.setAttribute('visible', 'false');
          this.el.sceneEl.appendChild(this.panel);

          const bg = document.createElement('a-plane');
          bg.setAttribute('width',  '0.7');
          bg.setAttribute('height', String(0.08 * this.items.length + 0.14));
          bg.setAttribute('color',  '#111122');
          bg.setAttribute('opacity','0.92');
          this.panel.appendChild(bg);

          const title = document.createElement('a-text');
          title.setAttribute('value',    '- GLB Bibliothek -');
          title.setAttribute('align',    'center');
          title.setAttribute('color',    '#00CCFF');
          title.setAttribute('width',    '1.3');
          title.setAttribute('position', '0 ' + (0.04 * this.items.length + 0.03) + ' 0.001');
          this.panel.appendChild(title);

          this.itemEls = [];
          for (let i = 0; i < this.items.length; i++) {
            const txt = document.createElement('a-text');
            txt.setAttribute('align',  'center');
            txt.setAttribute('width',  '1.2');
            txt.setAttribute('position',
              '0 ' + (0.04 * (this.items.length - 1 - i) - 0.02) + ' 0.001');
            this.panel.appendChild(txt);
            this.itemEls.push(txt);
          }

          const hint = document.createElement('a-text');
          hint.setAttribute('value',    'Stick: waehlen | Trigger: laden | Grip: schliessen');
          hint.setAttribute('align',    'center');
          hint.setAttribute('color',    '#888888');
          hint.setAttribute('width',    '0.95');
          hint.setAttribute('position', '0 ' + (-0.04 * this.items.length - 0.02) + ' 0.001');
          this.panel.appendChild(hint);

          this._highlight();
        },

        _highlight: function () {
          for (let i = 0; i < this.itemEls.length; i++) {
            const isSel = i === this.selectedIdx;
            this.itemEls[i].setAttribute('color', isSel ? '#FFD700' : '#FFFFFF');
            this.itemEls[i].setAttribute('value',
              (isSel ? '> ' : '  ') + this.items[i].name + '  [' + this.items[i].unit + ']');
          }
        },

        show:   function () { if (this.panel) { this.visible = true;  this.panel.setAttribute('visible', 'true');  } },
        hide:   function () { if (this.panel) { this.visible = false; this.panel.setAttribute('visible', 'false'); } },
        toggle: function () { this.visible ? this.hide() : this.show(); },

        navigateUp: function () {
          this.selectedIdx = (this.selectedIdx - 1 + this.items.length) % this.items.length;
          this._highlight();
        },

        navigateDown: function () {
          this.selectedIdx = (this.selectedIdx + 1) % this.items.length;
          this._highlight();
        },

        loadSelected: function () {
          try {
            const item    = this.items[this.selectedIdx];
            const modelEl = document.querySelector('#modell-objekt');
            const scale   = UNIT_SCALE[item.unit] || 1.0;

            setHudText('#ui-size', 'Modell laedt...', '#FFAA00');
            modelEl.setAttribute('auto-center', 'unitScale: ' + scale);
            modelEl.setAttribute('gltf-model', item.src);

            setHudText('#ui-modell-name', item.name);
            setHudText('#ui-scale-info', '1:1 (1 Einheit = 1 ' + item.unit + ')');
          } catch (err) {
            console.error('Bibliothek Lade-Fehler:', err);
          }
          this.hide();
        },

        tick: function () {
          if (!this.visible || !this.panel) return;
          try {
            const cam = this.el.sceneEl.camera;
            if (!cam) return;

            cam.getWorldPosition(this.tmpPos);
            // Blickrichtung NICHT negieren (siehe hud-follow)
            cam.getWorldDirection(this.tmpDir);
            cam.getWorldQuaternion(this.tmpQuat);

            this.panel.object3D.position.copy(this.tmpPos)
              .addScaledVector(this.tmpDir, 0.7);
            this.panel.object3D.quaternion.copy(this.tmpQuat);
          } catch (err) { /* nie kritisch */ }
        }
      });


      // ════════════════════════════════════════════════════════════════
      // KOMPONENTE 6: AR-STEUERUNG
      //
      // Trigger (auf Objekt zeigen) = GREIFEN: Objekt folgt dem
      //                               Controller natuerlich in alle
      //                               Richtungen (Position + Drehung)
      // Grip                        = Bibliothek oeffnen/schliessen
      // Stick X                     = Modell drehen
      // Stick Y                     = Zoom / Schnittebene / Bibliothek
      // A                           = Schnitt EIN/AUS
      // B                           = Schnitt-Achse (Y -> X -> Z)
      // Stick DRUECKEN              = Mass-Anzeige EIN/AUS
      // ════════════════════════════════════════════════════════════════
      AFRAME.registerComponent('ar-steuerung', {
        init: function () {
          this.controller = this.el;
          this.rig        = document.querySelector('#rig').object3D;
          this.modelNode  = document.querySelector('#model-node').object3D;

          this.isGrabbed = false;
          this.stickX    = 0;
          this.stickY    = 0;
          this.stickCool = 0;

          this.deadzone    = 0.2;
          this.rotateStep  = 0.05;
          this.zoomStep    = 0.03;
          this.minDistance = 0.2;
          this.maxDistance = 4.0;

          // Grab-Offsets (werden beim Zupacken berechnet)
          this.grabPosOffset  = new THREE.Vector3();
          this.grabQuatOffset = new THREE.Quaternion();

          this.tmpControllerPos  = new THREE.Vector3();
          this.tmpControllerQuat = new THREE.Quaternion();
          this.tmpInvQuat        = new THREE.Quaternion();
          this.tmpVec            = new THREE.Vector3();
          this.tmpCamPos         = new THREE.Vector3();
          this.tmpRigPos         = new THREE.Vector3();
          this.tmpDir            = new THREE.Vector3();
          this.tmpForward        = new THREE.Vector3();

          const getMenu = () => {
            const comps = this.el.components;
            return comps ? comps['bibliothek-menu'] : null;
          };
          const getClip = () => {
            const el = document.querySelector('#clip-controller');
            return el && el.components ? el.components['clipping-plane'] : null;
          };
          const getMass = () => {
            const el = document.querySelector('#model-node');
            return el && el.components ? el.components['mass-anzeige'] : null;
          };
          this._getMenu = getMenu;
          this._getClip = getClip;

          // --- TRIGGER: Greifen starten ---
          this.controller.addEventListener('triggerdown', () => {
            const menu = getMenu();
            if (menu && menu.visible) {
              menu.loadSelected();
              return;
            }
            const raycaster = this.controller.components.raycaster;
            const hits = raycaster ? raycaster.intersections : [];
            if (!hits || hits.length === 0) return;
            for (let i = 0; i < hits.length; i++) {
              if (hits[i].object && hits[i].object.el &&
                  hits[i].object.el.classList.contains('grabbable')) {

                // NATUERLICHES GREIFEN:
                // Versatz zwischen Objekt und Controller im Moment des
                // Zupackens merken - Objekt springt NICHT zum Controller,
                // sondern folgt ab jetzt relativ.
                this.controller.object3D.getWorldPosition(this.tmpControllerPos);
                this.controller.object3D.getWorldQuaternion(this.tmpControllerQuat);

                this.tmpInvQuat.copy(this.tmpControllerQuat).invert();

                // Positions-Versatz im Controller-Koordinatensystem
                this.grabPosOffset.copy(this.rig.position)
                  .sub(this.tmpControllerPos)
                  .applyQuaternion(this.tmpInvQuat);

                // Rotations-Versatz
                this.grabQuatOffset.copy(this.tmpInvQuat)
                  .multiply(this.rig.quaternion);

                this.isGrabbed = true;
                break;
              }
            }
          });
          this.controller.addEventListener('triggerup', () => {
            this.isGrabbed = false;
          });

          // --- GRIP: Bibliothek ---
          this.controller.addEventListener('gripdown', () => {
            const m = getMenu();
            if (m) m.toggle();
          });

          // --- STICK DRUECKEN: Mass-Anzeige ---
          this.controller.addEventListener('thumbstickdown', () => {
            const mass = getMass();
            if (mass) {
              const on = mass.toggle();
              setHudText('#ui-masse', on ? 'Masse: AN' : 'Masse: AUS',
                on ? '#00FFAA' : '#BBBBBB');
            }
          });

          // --- JOYSTICK ---
          this.controller.addEventListener('thumbstickmoved', (evt) => {
            this.stickX = evt.detail.x || 0;
            this.stickY = evt.detail.y || 0;
          });

          // --- A: Schnitt EIN/AUS ---
          this.controller.addEventListener('abuttondown', () => {
            const c = getClip();
            if (c) {
              c.toggle();
              setHudText('#ui-schnitt', c.enabled ? 'Schnitt: AN' : 'Schnitt: AUS',
                c.enabled ? '#00CCFF' : '#BBBBBB');
            }
          });

          // --- B: Achse wechseln ---
          this.controller.addEventListener('bbuttondown', () => {
            const c = getClip();
            if (c) {
              c.cycleAxis();
              setHudText('#ui-axis', 'Achse: ' + c.axis.toUpperCase());
            }
          });
        },

        tick: function () {
          if (!this.cameraObj) {
            const camEl = document.querySelector('a-camera');
            if (camEl && camEl.object3D) {
              this.cameraObj = camEl.object3D;
            } else {
              return;
            }
          }

          const menu = this._getMenu ? this._getMenu() : null;
          const clip = this._getClip ? this._getClip() : null;

          // --- Bibliothek offen: Stick navigiert ---
          if (menu && menu.visible) {
            if (this.stickCool <= 0 && Math.abs(this.stickY) > this.deadzone) {
              if (this.stickY > this.deadzone) menu.navigateDown();
              else                              menu.navigateUp();
              this.stickCool = 18;
            }
            if (this.stickCool > 0) this.stickCool--;
            return;
          }

          // --- GEGRIFFEN: Objekt folgt dem Controller natuerlich ---
          if (this.isGrabbed) {
            this.controller.object3D.getWorldPosition(this.tmpControllerPos);
            this.controller.object3D.getWorldQuaternion(this.tmpControllerQuat);

            // Position: Controller + (gedrehter Versatz)
            this.tmpVec.copy(this.grabPosOffset)
              .applyQuaternion(this.tmpControllerQuat);
            this.rig.position.copy(this.tmpControllerPos).add(this.tmpVec);

            // Drehung: Controller * Versatz
            this.rig.quaternion.copy(this.tmpControllerQuat)
              .multiply(this.grabQuatOffset);
            return;
          }

          // --- Nicht gegriffen: Rotation ---
          if (Math.abs(this.stickX) > this.deadzone) {
            this.modelNode.rotation.y += (this.stickX > 0 ? this.rotateStep : -this.rotateStep);
          }

          // --- Stick Y: Schnittebene ODER Zoom ---
          if (Math.abs(this.stickY) > this.deadzone) {
            if (clip && clip.enabled) {
              clip.move(this.stickY * -0.006);
            } else {
              this.cameraObj.getWorldPosition(this.tmpCamPos);
              this.rig.getWorldPosition(this.tmpRigPos);

              this.tmpDir.subVectors(this.tmpRigPos, this.tmpCamPos);
              let dist = this.tmpDir.length();

              if (dist < 0.0001) {
                this.cameraObj.getWorldDirection(this.tmpForward);
                this.tmpDir.copy(this.tmpForward);
                dist = 0.5;
              } else {
                this.tmpDir.normalize();
              }

              if (this.stickY > this.deadzone) {
                dist -= this.zoomStep;
              } else if (this.stickY < -this.deadzone) {
                dist += this.zoomStep;
              }

              dist = Math.max(this.minDistance, Math.min(this.maxDistance, dist));

              this.tmpRigPos.copy(this.tmpCamPos).add(this.tmpDir.multiplyScalar(dist));
              this.rig.position.copy(this.tmpRigPos);
            }
          }
        }
      });
    </script>
  </head>

  <body>
    <a-scene
      xr-mode-ui="XRMode: ar"
      webxr="optionalFeatures: hand-tracking;"
      renderer="colorManagement: true; antialias: true; physicallyCorrectLights: true; exposure: 1.2;">

      <a-assets>
        <a-asset-item id="meinModell" src="EntwurfARBrille.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 1.6 0"></a-camera>

      <a-light type="ambient" color="#FFF" intensity="0.6"></a-light>
      <a-light type="directional" color="#FFF" intensity="1.5" position="-1 2 1" castShadow="true"></a-light>
      <a-light type="directional" color="#FFDDBB" intensity="0.5" position="1 -1 -1"></a-light>

      <!-- HUD -->
      <a-entity id="hud" hud-follow="distance: 0.8; offsetY: -0.22">
        <a-plane width="0.55" height="0.28" color="#111122" opacity="0.75"></a-plane>
        <a-text id="ui-modell-name" value="AR Brille"
                align="center" color="#FFD700" width="1.1" position="0 0.10 0.001"></a-text>
        <a-text id="ui-scale-info" value="1:1 (1 Einheit = 1 m)"
                align="center" color="#00CCFF" width="0.9" position="0 0.06 0.001"></a-text>
        <a-text id="ui-size" value="Modell laedt..."
                align="center" color="#FFAA00" width="0.85" position="0 0.02 0.001"></a-text>
        <a-text id="ui-schnitt" value="Schnitt: AUS"
                align="center" color="#BBBBBB" width="0.8" position="0 -0.02 0.001"></a-text>
        <a-text id="ui-axis" value="Achse: Y"
                align="center" color="#BBBBBB" width="0.7" position="0 -0.05 0.001"></a-text>
        <a-text id="ui-masse" value="Masse: AUS"
                align="center" color="#BBBBBB" width="0.7" position="0 -0.08 0.001"></a-text>
        <a-text value="Grip: Bibliothek | A: Schnitt | B: Achse | Stick-Druck: Masse"
                align="center" color="#777777" width="0.85" position="0 -0.12 0.001"></a-text>
      </a-entity>

      <!-- RIG: Grab-Box + Modell -->
      <a-entity id="rig" position="0 1.2 -0.6">
        <a-box
          class="grabbable"
          position="0 0 0"
          depth="0.5"
          height="0.5"
          width="0.5"
          material="color: green; opacity: 0.2; transparent: true">
        </a-box>

        <a-entity id="model-node" mass-anzeige>
          <a-entity
            id="modell-objekt"
            gltf-model="#meinModell"
            scale="1 1 1"
            position="-0.5 0 0.2"
            auto-center>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Clipping Plane -->
      <a-entity id="clip-controller" clipping-plane></a-entity>

      <!-- CONTROLLER (rechts):
           Trigger      = Greifen (Objekt folgt natuerlich) / laden
           Grip         = Bibliothek
           Stick X      = Drehen
           Stick Y      = Zoom / Schnittebene / Bibliothek
           A            = Schnitt EIN/AUS
           B            = Achse Y -> X -> Z
           Stick-Druck  = Mass-Anzeige EIN/AUS
      -->
      <a-entity id="controller-right"
                oculus-touch-controls="hand: right"
                raycaster="objects: .grabbable; showLine: true; far: 100"
                line="color: yellow; opacity: 1"
                bibliothek-menu
                ar-steuerung>
      </a-entity>

      <!-- Freie Hand (nur Darstellung) -->
      <a-entity id="hand-right"
                hand-tracking-controls="hand: right; modelStyle: dots">
      </a-entity>

    </a-scene>
  </body>
</html>
