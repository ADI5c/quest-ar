<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Brille - 1:1 & Bibliothek</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script>

      // ════════════════════════════════════════════════════════════════
      // STEP-DATEIEN VERWENDEN (Anleitung)
      // ════════════════════════════════════════════════════════════════
      // Der Browser kann STEP (.step/.stp) NICHT direkt laden.
      // Konvertierung nötig: STEP → GLB
      //
      // EMPFOHLEN: FreeCAD (kostenlos, https://www.freecad.org)
      //   1. STEP-Datei öffnen
      //   2. Objekt im Modellbaum auswählen
      //   3. Datei → Exportieren → glTF (*.glb)
      //   4. FreeCAD exportiert in METERN (glTF-Standard)
      //      → in der Bibliothek unten: unit: 'm' eintragen
      //
      // MASSSTAB PRÜFEN:
      //   Das HUD zeigt die Bounding-Box in mm.
      //   Stimmen die Werte mit deinem CAD überein → 1:1 korrekt.
      //   Falsche Grösse? → unit anpassen ('mm', 'cm' oder 'm')
      //
      // WebXR projiziert automatisch 1:1 in die reale Welt:
      //   1 Einheit in Three.js = 1 realer Meter auf der Quest 2.
      // ════════════════════════════════════════════════════════════════


      // ════════════════════════════════════════════════════════════════
      // GLB BIBLIOTHEK
      //   name = Anzeigename im Menü
      //   src  = Dateipfad (relativ zur HTML-Datei)
      //   unit = Einheit, in der das GLB gezeichnet/exportiert wurde:
      //          'mm' → GLB-Werte sind Millimeter (Skalierung 0.001)
      //          'cm' → GLB-Werte sind Zentimeter (Skalierung 0.01)
      //          'm'  → GLB-Werte sind Meter     (Skalierung 1.0)
      //                 (FreeCAD-GLB-Export = 'm')
      // ════════════════════════════════════════════════════════════════
      const GLB_BIBLIOTHEK = [
        { name: 'AR Brille',       src: 'EntwurfARBrille.glb', unit: 'mm' },
        { name: 'STEP Export 1',   src: 'bauteil1.glb',        unit: 'm'  },
        { name: 'STEP Export 2',   src: 'bauteil2.glb',        unit: 'm'  },
        { name: 'Modell 4',        src: 'modell4.glb',         unit: 'cm' },
      ];

      // Einheit → Skalierungsfaktor (Meter pro GLB-Einheit)
      const UNIT_SCALE = { 'mm': 0.001, 'cm': 0.01, 'm': 1.0 };


      // ════════════════════════════════════════════════════════════════
      // KOMPONENTE 1: MODELL ZENTRIEREN + 1:1 MASSSTAB SETZEN
      // ════════════════════════════════════════════════════════════════
      AFRAME.registerComponent('auto-center', {
        schema: { unitScale: { type: 'number', default: 0.001 } },

        init: function () {
          this.el.addEventListener('model-loaded', (e) => {
            const model = e.detail.model;
            if (!model) return;

            const box = new THREE.Box3().setFromObject(model);
            if (box.isEmpty()) return;

            // Zentrieren (Modell-Mittelpunkt = Rig-Mittelpunkt)
            const center = new THREE.Vector3();
            box.getCenter(center);
            model.position.sub(center);

            // 1:1 Massstab anwenden
            const s = this.data.unitScale;
            this.el.object3D.scale.set(s, s, s);

            // Echte Grösse berechnen und anzeigen
            const size = new THREE.Vector3();
            box.getSize(size);
            const mmX = (size.x * s * 1000).toFixed(0);
            const mmY = (size.y * s * 1000).toFixed(0);
            const mmZ = (size.z * s * 1000).toFixed(0);

            console.log(`Modell geladen | reale Grösse: ${mmX} × ${mmY} × ${mmZ} mm`);

            const sizeEl = document.querySelector('#ui-size');
            if (sizeEl) sizeEl.setAttribute('value', `${mmX} × ${mmY} × ${mmZ} mm`);
          });
        }
      });


      // ════════════════════════════════════════════════════════════════
      // KOMPONENTE 2: SCHNITTANSICHT (Clipping Plane)
      // ════════════════════════════════════════════════════════════════
      AFRAME.registerComponent('clipping-plane', {
        init: function () {
          this.plane        = new THREE.Plane();
          this.clipPosition = 0;
          this.axis         = 'y';
          this.enabled      = false;

          const renderer = this.el.sceneEl.renderer;
          renderer.localClippingEnabled = true;
          renderer.clippingPlanes = [];

          this._buildPlaneVisual();
        },

        _buildPlaneVisual: function () {
          this.planeVisual = document.createElement('a-entity');
          document.querySelector('#rig').appendChild(this.planeVisual);
          this._updatePlaneVisual();
        },

        _updatePlaneVisual: function () {
          if (!this.planeVisual) return;
          const v = this.planeVisual;
          const p = this.clipPosition;
          const color   = this.enabled ? '#00CCFF' : '#888888';
          const opacity = this.enabled ? 0.35 : 0.0;

          if (this.axis === 'y') {
            v.setAttribute('geometry', 'primitive: plane; width: 0.8; height: 0.8');
            v.setAttribute('rotation', '-90 0 0');
            v.setAttribute('position', `0 ${p} 0`);
          } else if (this.axis === 'x') {
            v.setAttribute('geometry', 'primitive: plane; width: 0.8; height: 0.8');
            v.setAttribute('rotation', '0 90 0');
            v.setAttribute('position', `${p} 0 0`);
          } else {
            v.setAttribute('geometry', 'primitive: plane; width: 0.8; height: 0.8');
            v.setAttribute('rotation', '0 0 0');
            v.setAttribute('position', `0 0 ${p}`);
          }

          v.setAttribute('material',
            `color: ${color}; opacity: ${opacity}; transparent: true; side: double`);
          v.setAttribute('visible', this.enabled);
        },

        cycleAxis: function () {
          this.axis = this.axis === 'y' ? 'x' : this.axis === 'x' ? 'z' : 'y';
          this.clipPosition = 0;
          this._updatePlaneVisual();
        },

        toggle: function () {
          this.enabled = !this.enabled;
          const renderer = this.el.sceneEl.renderer;
          renderer.clippingPlanes = this.enabled ? [this.plane] : [];
          this._updatePlaneVisual();
        },

        move: function (delta) {
          this.clipPosition = Math.max(-0.5, Math.min(0.5, this.clipPosition + delta));
          this._updatePlaneVisual();
        },

        tick: function () {
          if (!this.enabled) return;
          const rig = document.querySelector('#rig').object3D;
          const rigPos = new THREE.Vector3();
          rig.getWorldPosition(rigPos);

          let normal;
          if      (this.axis === 'y') normal = new THREE.Vector3(0, -1,  0);
          else if (this.axis === 'x') normal = new THREE.Vector3(-1, 0,  0);
          else                         normal = new THREE.Vector3(0,  0, -1);

          const constant = -normal.dot(rigPos) + this.clipPosition;
          this.plane.set(normal, -constant);
        }
      });


      // ════════════════════════════════════════════════════════════════
      // KOMPONENTE 3: GLB BIBLIOTHEK MENÜ
      // ════════════════════════════════════════════════════════════════
      AFRAME.registerComponent('bibliothek-menu', {
        init: function () {
          this.visible     = false;
          this.selectedIdx = 0;
          this.items       = GLB_BIBLIOTHEK;
          this.panel       = null;
          this.itemEls     = [];

          this._buildPanel();
        },

        _buildPanel: function () {
          this.panel = document.createElement('a-entity');
          this.panel.setAttribute('id', 'bibliothek-panel');
          this.panel.setAttribute('visible', 'false');
          document.querySelector('a-scene').appendChild(this.panel);

          const bg = document.createElement('a-plane');
          bg.setAttribute('width',  '0.7');
          bg.setAttribute('height', String(0.08 * this.items.length + 0.14));
          bg.setAttribute('color',  '#111122');
          bg.setAttribute('opacity','0.92');
          bg.setAttribute('position', '0 0 0');
          this.panel.appendChild(bg);

          const title = document.createElement('a-text');
          title.setAttribute('value',    '— GLB Bibliothek —');
          title.setAttribute('align',    'center');
          title.setAttribute('color',    '#00CCFF');
          title.setAttribute('width',    '1.3');
          title.setAttribute('position', `0 ${0.04 * this.items.length + 0.03} 0.001`);
          this.panel.appendChild(title);

          this.itemEls = [];
          this.items.forEach((item, i) => {
            const row = document.createElement('a-entity');
            row.setAttribute('position',
              `0 ${0.04 * (this.items.length - 1 - i) - 0.02} 0.001`);

            const txt = document.createElement('a-text');
            txt.setAttribute('value',  `${item.name}  [${item.unit}]`);
            txt.setAttribute('align',  'center');
            txt.setAttribute('color',  '#FFFFFF');
            txt.setAttribute('width',  '1.2');
            row.appendChild(txt);

            this.panel.appendChild(row);
            this.itemEls.push({ row, txt });
          });

          const hint = document.createElement('a-text');
          hint.setAttribute('value',    'Stick-Y: waehlen   Trigger: laden   Menu: schliessen');
          hint.setAttribute('align',    'center');
          hint.setAttribute('color',    '#888888');
          hint.setAttribute('width',    '0.95');
          hint.setAttribute('position', `0 ${-0.04 * this.items.length - 0.02} 0.001`);
          this.panel.appendChild(hint);

          this._highlight();
        },

        _highlight: function () {
          this.itemEls.forEach((entry, i) => {
            const isSelected = i === this.selectedIdx;
            entry.txt.setAttribute('color', isSelected ? '#FFD700' : '#FFFFFF');
            entry.txt.setAttribute('value',
              `${isSelected ? '> ' : '  '}${this.items[i].name}  [${this.items[i].unit}]`);
          });
        },

        show:   function () { this.visible = true;  this.panel.setAttribute('visible', 'true');  },
        hide:   function () { this.visible = false; this.panel.setAttribute('visible', 'false'); },
        toggle: function () { this.visible ? this.hide() : this.show(); },

        navigateUp: function () {
          this.selectedIdx = (this.selectedIdx - 1 + this.items.length) % this.items.length;
          this._highlight();
        },

        navigateDown: function () {
          this.selectedIdx = (this.selectedIdx + 1) % this.items.length;
          this._highlight();
        },

        loadSelected: function () {
          const item    = this.items[this.selectedIdx];
          const modelEl = document.querySelector('#modell-objekt');
          const scale   = UNIT_SCALE[item.unit] || 0.001;

          modelEl.setAttribute('gltf-model', item.src);
          modelEl.setAttribute('auto-center', `unitScale: ${scale}`);

          const nameEl = document.querySelector('#ui-modell-name');
          if (nameEl) nameEl.setAttribute('value', item.name);
          const scaleEl = document.querySelector('#ui-scale-info');
          if (scaleEl) scaleEl.setAttribute('value', `1:1  (1 GLB-Einheit = 1 ${item.unit})`);

          this.hide();
        },

        tick: function () {
          if (this.visible) {
            const cam = document.querySelector('a-camera').object3D;
            const pos = new THREE.Vector3();
            const dir = new THREE.Vector3();
            cam.getWorldPosition(pos);
            cam.getWorldDirection(dir);
            this.panel.object3D.position.copy(pos).addScaledVector(dir, 0.7);
            this.panel.object3D.quaternion.copy(cam.quaternion);
          }
        }
      });


      // ════════════════════════════════════════════════════════════════
      // KOMPONENTE 4: AR-STEUERUNG
      //
      // Trigger       = Objekt greifen  /  Bibliothek: Modell laden
      // Joystick X    = Modell drehen
      // Joystick Y    = Zoom / Schnittebene / Bibliothek navigieren
      // A-Button      = Schnitt EIN/AUS
      // B-Button      = Schnitt-Achse wechseln
      // Menu-Button   = Bibliothek oeffnen/schliessen
      // ════════════════════════════════════════════════════════════════
      AFRAME.registerComponent('ar-steuerung', {
        init: function () {
          this.rig       = document.querySelector('#rig').object3D;
          this.modelNode = document.querySelector('#model-node').object3D;
          this.clipComp  = null;
          this.menuComp  = null;

          this.isGrabbed = false;
          this.stickX    = 0;
          this.stickY    = 0;
          this.stickCool = 0;

          this.deadzone    = 0.25;
          this.rotateStep  = 0.04;
          this.zoomStep    = 0.025;
          this.minDistance = 0.15;
          this.maxDistance = 5.0;
          this.holdOffset  = new THREE.Vector3(0, -0.02, -0.18);

          this.tmpControllerPos  = new THREE.Vector3();
          this.tmpControllerQuat = new THREE.Quaternion();
          this.tmpOffset         = new THREE.Vector3();
          this.tmpCamPos         = new THREE.Vector3();
          this.tmpRigPos         = new THREE.Vector3();
          this.tmpDir            = new THREE.Vector3();
          this.tmpForward        = new THREE.Vector3();

          // ── TRIGGER ───────────────────────────────────────────────────
          this.el.addEventListener('triggerdown', () => {
            const menu = this._getMenu();
            if (menu && menu.visible) {
              menu.loadSelected();
              return;
            }
            const raycaster = this.el.components.raycaster;
            const hits = raycaster ? raycaster.intersections : [];
            for (let i = 0; i < hits.length; i++) {
              if (hits[i].object?.el?.classList.contains('grabbable')) {
                this.isGrabbed = true;
                break;
              }
            }
          });
          this.el.addEventListener('triggerup', () => { this.isGrabbed = false; });

          // ── JOYSTICK ─────────────────────────────────────────────────
          this.el.addEventListener('thumbstickmoved', (evt) => {
            this.stickX = evt.detail.x || 0;
            this.stickY = evt.detail.y || 0;
          });

          // ── A-BUTTON: Schnitt EIN/AUS ─────────────────────────────────
          this.el.addEventListener('abuttondown', () => {
            const c = this._getClip();
            if (c) { c.toggle(); this._updateUI(); }
          });

          // ── B-BUTTON: Achse wechseln ──────────────────────────────────
          this.el.addEventListener('bbuttondown', () => {
            const c = this._getClip();
            if (c) { c.cycleAxis(); this._updateUI(); }
          });

          // ── MENU-BUTTON: Bibliothek ───────────────────────────────────
          this.el.addEventListener('menudown', () => {
            const m = this._getMenu();
            if (m) m.toggle();
          });
        },

        _getClip: function () {
          if (!this.clipComp) {
            const el = document.querySelector('#clip-controller');
            if (el) this.clipComp = el.components['clipping-plane'];
          }
          return this.clipComp;
        },

        _getMenu: function () {
          if (!this.menuComp) {
            const el = document.querySelector('#controller-right');
            if (el) this.menuComp = el.components['bibliothek-menu'];
          }
          return this.menuComp;
        },

        _updateUI: function () {
          const c = this._getClip();
          if (!c) return;
          const statusEl = document.querySelector('#ui-schnitt');
          const axisEl   = document.querySelector('#ui-axis');
          if (statusEl) statusEl.setAttribute('value',
            c.enabled ? 'Schnitt: AN' : 'Schnitt: AUS');
          if (axisEl) axisEl.setAttribute('value',
            'Achse: ' + c.axis.toUpperCase());
        },

        tick: function () {
          if (!this.cameraObj) {
            const camEl = document.querySelector('a-camera');
            if (!camEl?.object3D) return;
            this.cameraObj = camEl.object3D;
          }

          const clip = this._getClip();
          const menu = this._getMenu();

          // ── WENN GEGRIFFEN ────────────────────────────────────────────
          if (this.isGrabbed) {
            this.el.object3D.getWorldPosition(this.tmpControllerPos);
            this.el.object3D.getWorldQuaternion(this.tmpControllerQuat);
            this.tmpOffset.copy(this.holdOffset).applyQuaternion(this.tmpControllerQuat);
            this.rig.position.copy(this.tmpControllerPos).add(this.tmpOffset);
            this.rig.quaternion.copy(this.tmpControllerQuat);
            return;
          }

          // ── BIBLIOTHEK: Joystick navigiert ────────────────────────────
          if (menu && menu.visible) {
            if (this.stickCool <= 0 && Math.abs(this.stickY) > this.deadzone) {
              if (this.stickY > this.deadzone) menu.navigateDown();
              else                              menu.navigateUp();
              this.stickCool = 18;
            }
            if (this.stickCool > 0) this.stickCool--;
            return;
          }

          // ── JOYSTICK X: Modell drehen ─────────────────────────────────
          if (Math.abs(this.stickX) > this.deadzone) {
            this.modelNode.rotation.y +=
              (this.stickX > 0 ? this.rotateStep : -this.rotateStep);
          }

          // ── JOYSTICK Y: Schnittebene ODER Zoom ───────────────────────
          if (Math.abs(this.stickY) > this.deadzone) {
            if (clip && clip.enabled) {
              clip.move(this.stickY * -0.006);
            } else {
              this.cameraObj.getWorldPosition(this.tmpCamPos);
              this.rig.getWorldPosition(this.tmpRigPos);
              this.tmpDir.subVectors(this.tmpRigPos, this.tmpCamPos);
              let d = this.tmpDir.length();
              if (d < 0.0001) {
                this.cameraObj.getWorldDirection(this.tmpForward);
                this.tmpDir.copy(this.tmpForward);
                d = 0.5;
              } else {
                this.tmpDir.normalize();
              }
              d += (this.stickY > this.deadzone ? -this.zoomStep : this.zoomStep);
              d = Math.max(this.minDistance, Math.min(this.maxDistance, d));
              this.tmpRigPos.copy(this.tmpCamPos).add(this.tmpDir.multiplyScalar(d));
              this.rig.position.copy(this.tmpRigPos);
            }
          }
        }
      });

    </script>
  </head>

  <body>
    <a-scene
      xr-mode-ui="XRMode: ar"
      webxr="optionalFeatures: hand-tracking;"
      renderer="colorManagement: true; antialias: true; physicallyCorrectLights: true; exposure: 1.2;">

      <a-assets>
        <a-asset-item id="meinModell" src="EntwurfARBrille.glb"></a-asset-item>
      </a-assets>

      <!-- ── KAMERA + HUD ───────────────────────────────────────────── -->
      <a-camera position="0 1.6 0">
        <a-entity position="0 -0.28 -0.55">

          <a-text id="ui-modell-name"
                  value="AR Brille"
                  align="center" color="#FFD700" width="1.3"
                  position="0 0.10 0"></a-text>

          <a-text id="ui-scale-info"
                  value="1:1  (1 GLB-Einheit = 1 mm)"
                  align="center" color="#00CCFF" width="1.1"
                  position="0 0.04 0"></a-text>

          <a-text id="ui-size"
                  value="— mm"
                  align="center" color="#AAFFAA" width="1.0"
                  position="0 -0.02 0"></a-text>

          <a-text id="ui-schnitt"
                  value="Schnitt: AUS"
                  align="center" color="#888888" width="1.0"
                  position="0 -0.08 0"></a-text>

          <a-text id="ui-axis"
                  value="Achse: Y"
                  align="center" color="#888888" width="0.8"
                  position="0 -0.13 0"></a-text>

          <a-text value="Menu: Bibliothek   A: Schnitt   B: Achse   Trigger: Greifen"
                  align="center" color="#555555" width="1.4"
                  position="0 -0.19 0"></a-text>

        </a-entity>
      </a-camera>

      <!-- ── LICHT ──────────────────────────────────────────────────── -->
      <a-light type="ambient"     color="#FFF"    intensity="0.6"></a-light>
      <a-light type="directional" color="#FFF"    intensity="1.5"
               position="-1 2 1" castShadow="true"></a-light>
      <a-light type="directional" color="#FFDDBB" intensity="0.5"
               position="1 -1 -1"></a-light>

      <!-- ── RIG: Grab-Box + Modell ─────────────────────────────────── -->
      <a-entity id="rig" position="0 1.2 -0.5">

        <a-box
          id="grab-box"
          class="grabbable"
          position="0 0 0"
          depth="0.5" height="0.5" width="0.5"
          material="color: #00AA00; opacity: 0.12; transparent: true">
        </a-box>

        <a-entity id="model-node">
          <a-entity
            id="modell-objekt"
            gltf-model="#meinModell"
            auto-center="unitScale: 0.001">
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- ── CLIPPING PLANE ─────────────────────────────────────────── -->
      <a-entity id="clip-controller" clipping-plane></a-entity>

      <!-- ── CONTROLLER (rechts) ──────────────────────────────────────
           Trigger       = Greifen / Bibliothek: laden
           Joystick X    = Drehen
           Joystick Y    = Zoom / Schnittebene / Bibliothek
           A             = Schnitt EIN/AUS
           B             = Achse wechseln
           Menu          = Bibliothek
      -->
      <a-entity id="controller-right"
                oculus-touch-controls="hand: right"
                raycaster="objects: .grabbable; showLine: true; far: 100"
                line="color: yellow; opacity: 0.8"
                bibliothek-menu
                ar-steuerung>
      </a-entity>

      <!-- Freie Hand (nur Darstellung) -->
      <a-entity id="hand-right"
                hand-tracking-controls="hand: right; modelStyle: dots">
      </a-entity>

    </a-scene>
  </body>
</html>
